<ion-content [fullscreen]="true">
  <ion-row class="containerHeaderATD">
    <p id="title">Favoris</p>
  </ion-row>
  <div>
    <div class="pad-container">
      <p class="pad-left">• Son(s) :</p>
      @for (song of songs; track song) {
      <ion-item lines="full" class="items">
        <ion-col class="imgCov">
          <img class="cover-resize" src="{{song.cover}}" alt="Cover" (click)="goToPlayer()">
        </ion-col>
        <ion-col class="pad-text">
            <p class="song-text" (click)="goToPlayer()">{{song.title}}</p>
            <p class="light artist-text" (click)="goToPlayer()">Artist Name</p>
        </ion-col>
        <ion-col class="btnLS">
          <ion-row class="buttons-song">
            <a class="bt1" [style.color]="song.isLiked ? 'blue' : 'transparent'">
              <img class="like-resize" 
                [src]="song.isLiked ? 'assets/icon/likeClicked.svg' : 'assets/icon/like.svg'" 
                [alt]="song.isLiked ? 'Like Clicked' : 'Like Icon'" 
                (click)="onLike(song.id)">
            </a>
            <a class="bt2" color="transparent">
              <img class="share-resize" src="assets/icon/share.svg" alt="Share Button" (click)="onShareModal()">
            </a>
          </ion-row>
        </ion-col>
      </ion-item>
      }
    </div>
    <div class="pad-container">
      <p class="pad-left">• Playlist(s) :</p>
      @for (playlist of playlists; track playlist) {
      <ion-item lines="full" class="items">
        <ion-col class="imgCov">
          <img class="cover-resize" src="{{playlist.cover}}" alt="Cover 1">
        </ion-col>
        <ion-col class="pad-text">
            <p class="song-text" (click)="goToPlayer()">{{playlist.name}}</p>
            <p class="light artist-text" (click)="goToPlayer()">Artist Name</p>
        </ion-col>
        <ion-col class="btnLS">
          <ion-row class="buttons-song">
            <a class="bt1" [style.color]="playlist.isLiked ? 'blue' : 'transparent'">
              <img class="like-resize" 
                [src]="playlist.isLiked ? 'assets/icon/likeClicked.svg' : 'assets/icon/like.svg'" 
                [alt]="playlist.isLiked ? 'Like Clicked' : 'Like Icon'" 
                (click)="onLike(playlist.id)">
            </a>
            <a class="bt2" color="transparent">
              <img class="share-resize" src="assets/icon/share.svg" alt="Share Button" (click)="onShareModal()">
            </a>
          </ion-row>
        </ion-col>
      </ion-item>
      }
    </div>
  </div>
</ion-content>
